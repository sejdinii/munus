<!doctype html>
<!-- Static offline fallback, served by sw.js when a navigation misses
     both network and cache. Deliberately dependency-free: inline styles
     on the token palette, because when this page shows, nothing else
     loaded. Copy matches components/states OfflineState. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Munus — offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f8f6f6;
        color: #18181b;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", sans-serif;
        text-align: center;
        padding: 35px;
        box-sizing: border-box;
      }
      .tile {
        width: 68px;
        height: 68px;
        border-radius: 22px;
        background: #f0ecee;
        display: grid;
        place-items: center;
        font-size: 27px;
        margin: 0 auto 18px;
      }
      h1 {
        margin: 0;
        font-size: 26px;
        letter-spacing: -0.045em;
      }
      p {
        font-size: 13px;
        line-height: 1.45;
        color: #6f6f75;
        max-width: 300px;
      }
      a {
        display: inline-flex;
        min-height: 52px;
        align-items: center;
        justify-content: center;
        padding: 0 18px;
        margin-top: 16px;
        border-radius: 15px;
        background: #18181b;
        color: #fff;
        font-weight: 710;
        text-decoration: none;
        width: 100%;
        max-width: 300px;
        box-sizing: border-box;
      }
    </style>
  </head>
  <body>
    <div>
      <div class="tile" aria-hidden="true">!</div>
      <h1>No connection</h1>
      <p>
        Your favorites and prepared applications are still on this device.
        New roles will refresh when you reconnect.
      </p>
      <a href="/">Try again</a>
    </div>
  </body>
</html>
