<head>

  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      width: 100%;
      min-height: 100vh;
      background: #ffffff;
      overflow-x: hidden;
    }

    .vf-root, .vf-root * {
      font-family: 'Helvetica Now Var', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      box-sizing: border-box;
    }

    .vf-root button {
      -webkit-tap-highlight-color: transparent;
    }

    .liquid-glass,
    .liquid-glass-selected {
      position: relative;
      isolation: isolate;
    }

    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
    }

    .liquid-glass-selected {
      background: rgba(255, 255, 255, 0.12);
      background-blend-mode: luminosity;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2);
    }

    .liquid-glass::before,
    .liquid-glass-selected::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: exclude;
      pointer-events: none;
    }

    .liquid-glass::before {
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.45) 0%,
        rgba(255, 255, 255, 0.15) 20%,
        rgba(255, 255, 255, 0)    40%,
        rgba(255, 255, 255, 0)    60%,
        rgba(255, 255, 255, 0.15) 80%,
        rgba(255, 255, 255, 0.45) 100%);
    }

    .liquid-glass-selected::before {
      background: linear-gradient(180deg,
        rgba(255, 255, 255, 0.6)  0%,
        rgba(255, 255, 255, 0.25) 20%,
        rgba(255, 255, 255, 0)    40%,
        rgba(255, 255, 255, 0)    60%,
        rgba(255, 255, 255, 0.25) 80%,
        rgba(255, 255, 255, 0.6)  100%);
    }

    .fade-up {
      opacity: 0;
      animation: vfFadeUp 0.5s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes vfFadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @keyframes vfScaleIn {
      from { opacity: 0; transform: scale(0.92); }
      to   { opacity: 1; transform: scale(1); }
    }

    @keyframes vfSlideUp {
      from { opacity: 0; transform: translateY(40px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @media (prefers-reduced-motion: reduce) {
      .fade-up { animation-duration: 0.01s; }
      .vf-scale-in { animation-duration: 0.01s; }
      .vf-slide-up { animation-duration: 0.01s; }
    }
  </style>
</head>

    // ── Main App ──

    function JobSwipeMockup() {
      const [deckIndex, setDeckIndex] = useState(0);
      const [drag, setDrag] = useState({ x: 0, y: 0 });
      const [dragging, setDragging] = useState(false);
      const [fly, setFly] = useState(null);
      const [applied, setApplied] = useState([]);
      const [saved, setSaved] = useState(() => new Set());
      const [tab, setTab] = useState("deck");

      // Onboarding
      const [showOnboarding, setShowOnboarding] = useState(true);
      const [onboardingStep, setOnboardingStep] = useState(0);

      // Saved tab: expanded job + applying job
      const [savedExpandedJob, setSavedExpandedJob] = useState(null);
      const [applyingJob, setApplyingJob] = useState(null);
      const [applyingConfirming, setApplyingConfirming] = useState(false);
      const [undoStack, setUndoStack] = useState([]);

      const startRef = useRef({ x: 0, y: 0 });

      // Navigate to saved tab when user taps the saved bookmark or swipes right from empty deck
      const goToSaved = () => setTab("saved");

      const topJob = JOBS[deckIndex];
      const visible = JOBS.slice(deckIndex, deckIndex + 3);

      const fx = fly ? fly.x : drag.x;
      const fy = fly ? fly.y : drag.y;
      const rot = fly ? fly.rot : drag.x * 0.06;
      const saveOpacity = clamp01(fx / SWIPE_THRESHOLD);
      const skipOpacity = clamp01(-fx / SWIPE_THRESHOLD);
      const nextReveal = fly ? 1 : clamp01(Math.abs(drag.x) / SWIPE_THRESHOLD);

      // Swipe right → save to favorites. Swipe left → skip.
      const launch = (dir) => {
        if (fly || !topJob) return;
        const jobId = topJob.id;
        const wasSaved = saved.has(jobId);
        setUndoStack((prev) => [...prev, { jobId, wasSaved, deckIndex }]);
        if (dir > 0) {
          // Right swipe → save to favorites
          setSaved((prev) => new Set([...prev, jobId]));
          setDragging(false);
          setFly({ x: dir * 520, y: drag.y, rot: dir * 22 });
          window.setTimeout(() => {
            setDeckIndex((i) => i + 1);
            setDrag({ x: 0, y: 0 });
            setFly(null);
          }, 450);
        } else {
          // Left swipe → skip
          setDragging(false);
          setFly({ x: dir * 520, y: drag.y, rot: dir * 22 });
          window.setTimeout(() => {
            setDeckIndex((i) => i + 1);
            setDrag({ x: 0, y: 0 });
            setFly(null);
          }, 450);
        }
      };

      // Apply from saved flow
      const startApplyFromSaved = (job) => {
        setApplyingJob(job);
        setApplyingConfirming(false);
      };

      const confirmSavedApply = () => {
        if (!applyingJob) return;
        setApplied((a) => [...a, applyingJob.id]);
        setSaved((prev) => {
          const next = new Set(prev);
          next.delete(applyingJob.id);
          return next;
        });
        setApplyingConfirming(true);
        window.setTimeout(() => {
          setApplyingJob(null);
          setApplyingConfirming(false);
          setSavedExpandedJob(null);
          setTab("apps");
        }, 600);
      };

      const cancelSavedApply = () => {
        setApplyingJob(null);
        setApplyingConfirming(false);
      };

      const onPointerDown = (e) => {
        if (fly || !topJob || applyingJob) return;
        e.currentTarget.setPointerCapture(e.pointerId);
        startRef.current = { x: e.clientX - drag.x, y: e.clientY - drag.y };
        setDragging(true);
      };

      const onPointerMove = (e) => {
        if (!dragging || fly) return;
        setDrag({ x: e.clientX - startRef.current.x, y: e.clientY - startRef.current.y });
      };

      const onPointerUp = () => {
        if (!dragging) return;
        setDragging(false);
        if (drag.x > SWIPE_THRESHOLD) launch(1);
        else if (drag.x < -SWIPE_THRESHOLD) launch(-1);
        else setDrag({ x: 0, y: 0 });
      };

      const toggleSave = () => {
        if (!topJob) return;
        setSaved((prev) => {
          const next = new Set(prev);
          if (next.has(topJob.id)) next.delete(topJob.id);
          else next.add(topJob.id);
          return next;
        });
      };

      const undoLastSwipe = () => {
        if (undoStack.length === 0) return;
        const last = undoStack[undoStack.length - 1];
        setUndoStack((prev) => prev.slice(0, -1));
        setFly(null);
        setDrag({ x: 0, y: 0 });
        setDeckIndex(last.deckIndex);
        if (last.wasSaved) {
          setSaved((prev) => new Set([...prev, last.jobId]));
        } else {
          setSaved((prev) => {
            const next = new Set(prev);
            next.delete(last.jobId);
            return next;
          });
        }
      };

      const resetDeck = () => {
        setDeckIndex(0);
        setApplied([]);
        setSaved(new Set());
        setDrag({ x: 0, y: 0 });
        setFly(null);
        setSavedExpandedJob(null);
        setApplyingJob(null);
        setUndoStack([]);
      };

      const isSaved = topJob ? saved.has(topJob.id) : false;
      const green = "rgba(134, 220, 150, 0.95)";

      const savedJobs = JOBS.filter((j) => saved.has(j.id));
      const appliedJobs = applied.map((id) => JOBS.find((j) => j.id === id)).filter(Boolean);

      return (
        <div className="vf-root" style={{
          minHeight: "100vh", width: "100%", background: "#ffffff",
          display: "flex", alignItems: "center", justifyContent: "center", padding: "48px 24px"
        }}>
          <div style={{
            position: "relative", width: 375, height: 780, flexShrink: 0, borderRadius: 52,
            background: "#8a9aaa", overflow: "hidden",
            boxShadow: "inset 0 0 0 2px rgba(255,255,255,0.08), 0 0 0 1px rgba(0,0,0,0.6), 0 0 0 10px #1a1a1e, 0 0 0 11px rgba(255,255,255,0.06), 0 0 60px rgba(0,0,0,0.5)"
          }}>
            <div style={{
              position: "absolute", inset: 0,
              backgroundImage: `url("${BG_URL}")`,
              backgroundSize: "cover", backgroundPosition: "center",
              filter: "blur(12px)", transform: "scale(1.1)"
            }} />
            <div style={{ position: "absolute", inset: 0, background: "rgba(138, 154, 170, 0.3)" }} />

            <div style={{
              position: "absolute", top: 12, left: "50%", transform: "translateX(-50%)",
              width: 120, height: 32, borderRadius: 9999, background: "#000000", zIndex: 50
            }} />

            {/* ── ONBOARDING ── */}
            {showOnboarding && (
              <OnboardingScreen
                step={onboardingStep}
                onBack={() => setOnboardingStep((s) => Math.max(0, s - 1))}
                onNext={() => setOnboardingStep((s) => Math.min(2, s + 1))}
                onFinish={() => setShowOnboarding(false)}
              />
            )}

            {/* ── MAIN APP ── */}
            {!showOnboarding && (
              <div style={{
                position: "relative", zIndex: 10, height: "100%", display: "flex",
                flexDirection: "column", padding: "56px 24px 24px"
              }}>
                {/* Header */}
                <div className="fade-up" style={{
                  animationDelay: "0.1s", marginBottom: 18, display: "flex",
                  alignItems: "center", justifyContent: "space-between"
                }}>
                  <div className="liquid-glass" style={{
                    display: "inline-flex", alignItems: "center", gap: 6,
                    padding: "10px 12px", borderRadius: 9999
                  }}>
                    <IconBriefcase size={12} color="rgba(255,255,255,0.8)" />
                    <span style={{ fontSize: 12, fontWeight: 500, color: "rgba(255,255,255,0.9)" }}>
                      Job Swipe
                    </span>
                  </div>
                  <button type="button" aria-label="Filters" className="liquid-glass" style={{
                    width: 36, height: 36, borderRadius: "50%", border: "none", outline: "none",
                    appearance: "none", WebkitAppearance: "none", cursor: "pointer",
                    display: "flex", alignItems: "center", justifyContent: "center"
                  }}>
                    <IconSlidersHorizontal size={14} color="rgba(255,255,255,0.8)" />
                  </button>
                </div>

                {/* ── DECK TAB ── */}
                {tab === "deck" && (
                  <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
                    <div className="fade-up" style={{ animationDelay: "0.22s", marginBottom: 20 }}>
                      <p style={{ margin: "0 0 8px", fontSize: 14, color: "rgba(255,255,255,0.6)" }}>
                        Ranked by your verified evidence
                      </p>
                      <h1 style={{ margin: 0, fontSize: 26, fontWeight: 400, lineHeight: 1.2, letterSpacing: "-0.025em", color: "#ffffff" }}>
                        Today's Matches
                      </h1>
                    </div>

                    <div className="fade-up" style={{ animationDelay: "0.38s", flex: 1, position: "relative", marginBottom: 20 }}>
                      {visible.length === 0 && (
                        <div style={{ position: "absolute", inset: 0, display: "flex", alignItems: "center", justifyContent: "center" }}>
                          <div className="liquid-glass" style={{
                            width: "100%", borderRadius: 32, padding: "28px 24px",
                            display: "flex", flexDirection: "column", alignItems: "center", textAlign: "center"
                          }}>
                            <div className="liquid-glass" style={{
                              width: 52, height: 52, borderRadius: "50%", display: "flex",
                              alignItems: "center", justifyContent: "center", marginBottom: 14
                            }}>
                              <IconBriefcase size={20} color="rgba(255,255,255,0.8)" />
                            </div>
                            <div style={{ fontSize: 18, fontWeight: 500, color: "#ffffff" }}>
                              No more matches for today
                            </div>
                            <div style={{ marginTop: 6, fontSize: 13, color: "rgba(255,255,255,0.6)" }}>
                              {saved.size} saved · {applied.length} applied
                            </div>
                            <button type="button" onClick={resetDeck} className="liquid-glass" style={{
                              marginTop: 18, display: "inline-flex", alignItems: "center", gap: 6,
                              padding: "10px 16px", borderRadius: 9999, border: "none", outline: "none",
                              appearance: "none", WebkitAppearance: "none", cursor: "pointer"
                            }}>
                              <IconRotateCcw size={14} color="rgba(255,255,255,0.85)" />
                              <span style={{ fontSize: 13, fontWeight: 500, color: "rgba(255,255,255,0.85)" }}>
                                Reset
                              </span>
                            </button>
                          </div>
                        </div>
                      )}

                      {visible.map((job, pos) => {
                        const isTop = pos === 0;
                        const stackTransform = `translateY(${pos * 14}px) scale(${1 - pos * 0.05})`;
                        const topTransform = `translate(${fx}px, ${fy}px) rotate(${rot}deg)`;
                        return (
                          <div key={job.id}
                            onPointerDown={isTop ? onPointerDown : undefined}
                            onPointerMove={isTop ? onPointerMove : undefined}
                            onPointerUp={isTop ? onPointerUp : undefined}
                            onPointerCancel={isTop ? onPointerUp : undefined}
                            className={isTop ? "liquid-glass-selected" : "liquid-glass"}
                            style={{
                              position: "absolute", inset: 0, borderRadius: 32, zIndex: 20 - pos,
                              transform: isTop ? topTransform : stackTransform,
                              opacity: isTop && fly ? 0 : 1,
                              transition: isTop
                                ? dragging ? "none" : "transform 0.45s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.45s ease"
                                : "transform 0.4s cubic-bezier(0.22, 1, 0.36, 1)",
                              cursor: isTop ? (dragging ? "grabbing" : "grab") : "default",
                              touchAction: isTop ? "none" : "auto",
                              pointerEvents: isTop ? "auto" : "none",
                              userSelect: "none", WebkitUserSelect: "none"
                            }}
                          >
                            <JobCardContent job={job} position={deckIndex + pos + 1} total={JOBS.length}
                              reveal={pos === 0 ? 1 : pos === 1 ? nextReveal : 0}
                              animate={!dragging} />

                            {isTop && (
                              <React.Fragment>
                                {/* SAVED stamp — swipe right */}
                                <div style={{
                                  position: "absolute", top: 22, left: 20, transform: "rotate(-12deg)",
                                  border: "2.5px solid rgba(134, 220, 150, 0.95)", color: "rgba(134, 220, 150, 0.95)",
                                  padding: "4px 12px", borderRadius: 10, fontSize: 22, fontWeight: 700,
                                  letterSpacing: "0.15em", opacity: saveOpacity, pointerEvents: "none"
                                }}>
                                  SAVED
                                </div>
                                {/* SKIP stamp — swipe left */}
                                <div style={{
                                  position: "absolute", top: 22, right: 20, transform: "rotate(12deg)",
                                  border: "2.5px solid rgba(180, 180, 190, 0.95)", color: "rgba(180, 180, 190, 0.95)",
                                  padding: "4px 12px", borderRadius: 10, fontSize: 22, fontWeight: 700,
                                  letterSpacing: "0.15em", opacity: skipOpacity, pointerEvents: "none"
                                }}>
                                  SKIP
                                </div>
                              </React.Fragment>
                            )}
                          </div>
                        );
                      }).reverse()}
                    </div>

                    {topJob && (
                      <React.Fragment>
                        <div className="fade-up" style={{
                          animationDelay: "0.6s", display: "flex", alignItems: "center",
                          justifyContent: "center", gap: 16
                        }}>
                          {/* Left: Skip */}
                          <button type="button" aria-label="Skip" onClick={() => launch(-1)}
                            className="liquid-glass" style={{
                              width: 52, height: 52, borderRadius: "50%", border: "none", outline: "none",
                              appearance: "none", WebkitAppearance: "none", cursor: "pointer",
                              display: "flex", alignItems: "center", justifyContent: "center"
                            }}>
                            <IconX size={22} color="rgba(255,255,255,0.9)" />
                          </button>

                          {/* Center: Undo */}
                          <button type="button" aria-label="Undo last swipe"
                            onClick={undoLastSwipe}
                            disabled={undoStack.length === 0}
                            className="liquid-glass" style={{
                              width: 40, height: 40, borderRadius: "50%", border: "none", outline: "none",
                              appearance: "none", WebkitAppearance: "none", cursor: undoStack.length === 0 ? "default" : "pointer",
                              display: "flex", alignItems: "center", justifyContent: "center",
                              opacity: undoStack.length === 0 ? 0.35 : 0.85,
                              transition: "opacity 0.2s ease"
                            }}>
                            <IconRotateCcw size={16} color="rgba(255,215,0,0.9)" />
                          </button>

                          {/* Right: Heart / Save */}
                          <button type="button" aria-label="Save" aria-pressed={isSaved} onClick={toggleSave}
                            className="liquid-glass" style={{
                              width: 56, height: 56, borderRadius: "50%", border: "none", outline: "none",
                              appearance: "none", WebkitAppearance: "none", cursor: "pointer",
                              display: "flex", alignItems: "center", justifyContent: "center",
                              transition: "box-shadow 0.25s ease, border-color 0.25s ease",
                              boxShadow: isSaved ? "0 0 18px 2px rgba(255, 215, 0, 0.5), 0 0 36px 6px rgba(255, 180, 0, 0.25)" : "none"
                            }}>
                            <IconHeart size={22}
                              color={isSaved ? "rgba(255,215,0,0.95)" : "rgba(255,255,255,0.8)"}
                              fill={isSaved ? "rgba(255,215,0,0.95)" : "none"} />
                          </button>
                        </div>

                        <div className="fade-up" style={{
                          animationDelay: "0.75s", marginTop: 12, textAlign: "center",
                          fontSize: 11, color: "rgba(255,255,255,0.4)"
                        }}>
                          Swipe right to save · swipe left to skip
                        </div>
                      </React.Fragment>
                    )}
                  </div>
                )}

                {/* ── SAVED TAB ── */}
                {tab === "saved" && (
                  <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
                    <div className="fade-up" style={{ animationDelay: "0.05s", marginBottom: 16 }}>
                      <p style={{ margin: "0 0 8px", fontSize: 14, color: "rgba(255,255,255,0.6)" }}>
                        Tailored applications ready
                      </p>
                      <h1 style={{ margin: 0, fontSize: 26, fontWeight: 400, lineHeight: 1.2, letterSpacing: "-0.025em", color: "#ffffff" }}>
                        Saved
                      </h1>
                    </div>
                    <div className="fade-up" style={{
                      animationDelay: "0.15s", flex: 1, minHeight: 0, overflowY: "auto",
                      display: "flex", flexDirection: "column"
                    }}>
                      {savedJobs.length === 0 ? (
                        <EmptyHint title="Nothing saved yet"
                          sub="Swipe right on a job to save it here. We'll prepare a tailored CV and cover letter for each one." />
                      ) : (
                        savedJobs.map((job) => {
                          const isExpanded = savedExpandedJob === job.id;
                          if (isExpanded) {
                            return (
                              <SavedJobExpanded
                                key={job.id}
                                job={job}
                                onCollapse={() => setSavedExpandedJob(null)}
                                onApply={() => startApplyFromSaved(job)}
                              />
                            );
                          }
                          return (
                            <SavedJobCollapsed
                              key={job.id}
                              job={job}
                              onExpand={() => setSavedExpandedJob(job.id)}
                              onApply={startApplyFromSaved}
                            />
                          );
                        })
                      )}
                    </div>
                  </div>
                )}

                {/* ── APPS TAB ── */}
                {tab === "apps" && (
                  <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
                    <div className="fade-up" style={{ animationDelay: "0.05s", marginBottom: 16 }}>
                      <p style={{ margin: "0 0 8px", fontSize: 14, color: "rgba(255,255,255,0.6)" }}>
                        Employer signals
                      </p>
                      <h1 style={{ margin: 0, fontSize: 26, fontWeight: 400, lineHeight: 1.2, letterSpacing: "-0.025em", color: "#ffffff" }}>
                        Applications
                      </h1>
                    </div>
                    <div className="fade-up" style={{
                      animationDelay: "0.15s", flex: 1, minHeight: 0, overflowY: "auto",
                      display: "flex", flexDirection: "column"
                    }}>
                      {appliedJobs.length === 0 ? (
                        <EmptyHint title="No applications yet"
                          sub="Save jobs you like, then apply from the Saved tab with a tailored CV and cover letter." />
                      ) : (
                        appliedJobs.map((job, i) => {
                          const status = statusFor(i);
                          const hot = status !== "Applied";
                          return (
                            <JobRow key={job.id} job={job} right={
                              <span style={{
                                flexShrink: 0, fontSize: 10, fontWeight: 600, letterSpacing: "0.04em",
                                textTransform: "uppercase", padding: "4px 8px", borderRadius: 9999,
                                background: hot ? "rgba(220,200,80,0.18)" : "rgba(255,255,255,0.08)",
                                border: hot ? "1px solid rgba(220,200,80,0.5)" : "1px solid rgba(255,255,255,0.15)",
                                color: hot ? "rgba(232,218,130,0.95)" : "rgba(255,255,255,0.7)"
                              }}>
                                {status}
                              </span>
                            } />
                          );
                        })
                      )}
                    </div>
                  </div>
                )}

                {/* ── PROFILE TAB ── */}
                {tab === "profile" && (
                  <div style={{ display: "flex", flexDirection: "column", flex: 1, minHeight: 0 }}>
                    <div className="fade-up" style={{ animationDelay: "0.05s", marginBottom: 16 }}>
                      <p style={{ margin: "0 0 8px", fontSize: 14, color: "rgba(255,255,255,0.6)" }}>
                        Verified account
                      </p>
                      <h1 style={{ margin: 0, fontSize: 26, fontWeight: 400, lineHeight: 1.2, letterSpacing: "-0.025em", color: "#ffffff" }}>
                        Profile
                      </h1>
                    </div>
                    <div className="fade-up" style={{
                      animationDelay: "0.15s", flex: 1, minHeight: 0, overflowY: "auto",
                      display: "flex", flexDirection: "column"
                    }}>
                      <div className="liquid-glass" style={{ borderRadius: 24, padding: 18, marginBottom: 12, flexShrink: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                          <div className="liquid-glass" style={{
                            width: 52, height: 52, borderRadius: "50%", display: "flex",
                            alignItems: "center", justifyContent: "center", flexShrink: 0
                          }}>
                            <span style={{ fontSize: 16, fontWeight: 600, color: "rgba(255,255,255,0.9)" }}>E</span>
                          </div>
                          <div>
                            <div style={{ fontSize: 17, fontWeight: 500, color: "#ffffff" }}>Enes</div>
                            <div style={{ marginTop: 2, fontSize: 12, color: "rgba(255,255,255,0.55)" }}>
                              Data Science · Leipzig / UAE
                            </div>
                          </div>
                        </div>
                        <div style={{ marginTop: 14, display: "flex", alignItems: "center", gap: 6 }}>
                          <IconShieldCheck size={14} color="rgba(220,200,80,0.9)" />
                          <span style={{ fontSize: 12, color: "rgba(255,255,255,0.75)" }}>
                            12 skills verified · 3 evidence sources
                          </span>
                        </div>
                        <div style={{ marginTop: 12 }}>
                          <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                            <span style={{ fontSize: 11, fontWeight: 500, color: "rgba(255,255,255,0.5)" }}>
                              Profile strength
                            </span>
                            <span style={{ fontSize: 13, fontWeight: 500, color: "rgba(255,255,255,0.9)" }}>82%</span>
                          </div>
                          <div style={{ marginTop: 6, height: 4, borderRadius: 9999, background: "rgba(255,255,255,0.15)", overflow: "hidden" }}>
                            <div style={{ width: "82%", height: "100%", borderRadius: 9999, background: "rgba(255,255,255,0.85)" }} />
                          </div>
                        </div>
                      </div>
                      {["Verified CV", "Evidence archive", "Job preferences"].map((label) => (
                        <button key={label} type="button" className="liquid-glass" style={{
                          width: "100%", borderRadius: 20, padding: "14px 16px", marginBottom: 10,
                          border: "none", outline: "none", appearance: "none", WebkitAppearance: "none",
                          cursor: "pointer", display: "flex", alignItems: "center",
                          justifyContent: "space-between", flexShrink: 0
                        }}>
                          <span style={{ fontSize: 14, fontWeight: 500, color: "rgba(255,255,255,0.9)" }}>
                            {label}
                          </span>
                          <IconChevronRight size={16} color="rgba(255,255,255,0.4)" />
                        </button>
                      ))}
                    </div>
                  </div>
                )}

                {/* ── Bottom Tab Bar ── */}
                <div className="fade-up liquid-glass" style={{
                  animationDelay: "0.5s", marginTop: 14, borderRadius: 9999, padding: 6,
                  display: "flex", alignItems: "center", justifyContent: "space-between", flexShrink: 0
                }}>
                  {TABS.map((t) => {
                    const active = tab === t.id;
                    const Icon = t.icon;
                    const count = t.id === "saved" ? saved.size : t.id === "apps" ? applied.length : 0;
                    return (
                      <button key={t.id} type="button" onClick={() => { setTab(t.id); setSavedExpandedJob(null); setApplyingJob(null); }} aria-pressed={active}
                        className={active ? "liquid-glass-selected" : ""} style={{
                          position: "relative", flex: 1, height: 48, borderRadius: 9999,
                          border: "none", outline: "none", appearance: "none", WebkitAppearance: "none",
                          cursor: "pointer", background: active ? undefined : "transparent",
                          display: "flex", flexDirection: "column", alignItems: "center",
                          justifyContent: "center", gap: 3
                        }}>
                        <Icon size={18} color={active ? "#ffffff" : "rgba(255,255,255,0.45)"} />
                        <span style={{
                          fontSize: 9, fontWeight: 500, letterSpacing: "0.02em",
                          color: active ? "rgba(255,255,255,0.9)" : "rgba(255,255,255,0.45)"
                        }}>
                          {t.label}
                        </span>
                        {count > 0 && (
                          <span style={{
                            position: "absolute", top: 5, left: "calc(50% + 6px)",
                            minWidth: 14, height: 14, padding: "0 4px", borderRadius: 9999,
                            background: "rgba(220,200,80,0.9)", color: "#1a1a1e",
                            fontSize: 9, fontWeight: 700, display: "flex",
                            alignItems: "center", justifyContent: "center"
                          }}>
                            {count}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}

            {/* ── APPLY FROM SAVED MODAL ── */}
            {applyingJob && (
              <ApplyFromSavedModal
                job={applyingJob}
                onConfirm={confirmSavedApply}
                onCancel={cancelSavedApply}
                confirming={applyingConfirming}
              />
            )}
          </div>
        </div>
      );
    }

    // ── Render ──
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<JobSwipeMockup />);
  </script>
  <style>{`
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(0deg); }
      }
    }
  `}</style>
</body>
</html>
